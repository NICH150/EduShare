<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduShare – Top Up Coins</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../style/topup.css" />
</head>
<body>

  <!--DESKTOP NAV-->

<nav class="desktop-nav">
  <span class="nav-logo">EduShare</span>
  <ul class="nav-links">
    <li><a href="upload.html">Upload</a></li>
    <li><a href="index.html">Dashboard</a></li>
  </ul>
  <div class="nav-right">
    <a href="topup.html" class="coin-badge text-decor-none">
        <div class="coin-dot"></div>
        <span id="nav-coins">25 Coins</span>
    </a>
    <div class="avatar">
      <svg width="18" height="18" fill="none" stroke="#6b7280" stroke-width="2" viewBox="0 0 24 24">
        <rect x="3" y="3" width="18" height="18" rx="3"/>
        <line x1="9" y1="9" x2="15" y2="9"/>
        <line x1="9" y1="12" x2="15" y2="12"/>
        <line x1="9" y1="15" x2="13" y2="15"/>
      </svg>
    </div>
  </div>
</nav>

<!--MOBILE HEADER-->
<header class="mobile-header">
  <span class="nav-logo">EduShare</span>
  <div class="coin-badge">
    <div class="coin-dot"></div>
    25 Coins
  </div>
</header>

<!--MOBILE SEARCH BAR-->
<div class="mobile-search-wrap">
  <div class="mobile-search-bar">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input type="text" placeholder="Search for notes, past papers, textbooks..." id="mobileSearch"/>
    <button class="search-go-btn" aria-label="Go">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <line x1="5" y1="12" x2="19" y2="12"/>
        <polyline points="12 5 19 12 12 19"/>
      </svg>
    </button>
  </div>
</div>

  <!-- ── MAIN ── -->
  <main class="main-content">

    <!-- Balance Card -->
    <section class="balance-card">
      <div class="balance-info">
        <p class="balance-label">Current Balance</p>
        <div class="balance-amount">
          <span class="coin-big">●</span>
          <span id="balance-display">25</span>
        </div>
      </div>

      <a href="withdrawal.html" id="withdrawal" class="withdraw-btn">
        <span>Withdraw</span>
      </a>
      
    </section>

    <!-- Package Selection -->
    <section class="package-section">
      <h2 class="section-title">Select Package</h2>
      <div class="package-grid" id="package-grid">
        <!-- Injected by JS -->
      </div>

      <!-- Custom Amount -->
      <div class="custom-amount-wrapper">
        <label class="custom-label">Custom Amount <span>(Min 10 Coins)</span></label>
        <div class="custom-input-row">
          <span class="coin-icon-sm">●</span>
          <input
            type="number"
            id="custom-amount"
            class="custom-input"
            placeholder="Enter custom amount"
            min="10"
          />
        </div>
      </div>
    </section>

    <!-- Payment + Confirm -->
    <section class="payment-section">
      <div class="payment-left">
        <h2 class="section-title">Payment Method</h2>
        <div class="payment-methods" id="payment-methods">
          <!-- Injected by JS -->
        </div>
      </div>

      <div class="payment-right">
        <div class="total-block">
          <div class="total-label">
            <span>Total Payment</span>
          </div>
          <div class="total-amount" id="total-amount">Rp 0</div>
        </div>
        <button class="confirm-btn" id="confirm-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          Confirm Top Up
        </button>
        <p class="secured-text">Secured by Midtrans</p>
      </div>
    </section>

  </main>


  <!-- ── TOAST ── -->
  <div class="toast" id="toast"></div>

  <script src="../script/topup.js"></script>
</body>
</html>
